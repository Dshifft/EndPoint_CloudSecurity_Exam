name: endpoint-exam

services:
  api:
    image: ${API_IMAGE:-endpoint-exam-api}:${IMAGE_TAG:?Set IMAGE_TAG to the image tag to deploy}
    restart: unless-stopped
    env_file:
      - .env
      - path: .env.monitoring
        required: false
    environment:
      POSTGRES_HOST: postgres
      OTEL_SERVICE_NAME: endpoint-cloudsecurity-exam
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: ${NGINX_IMAGE:-endpoint-exam-nginx}:${IMAGE_TAG:?Set IMAGE_TAG to the image tag to deploy}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_started

  backups:
    image: ${BACKUPS_IMAGE:-endpoint-exam-backups}:${IMAGE_TAG:?Set IMAGE_TAG to the image tag to deploy}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - postgres_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  postgres_backups:
