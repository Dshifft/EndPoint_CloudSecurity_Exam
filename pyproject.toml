[tool.poetry]
name = "endpoint-cloudsecurity-exam"
version = "0.1.0"
description = "Banking REST API for the EndPoint Cloud Security final project"
authors = ["Dshifft"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = { extras = ["standard"], version = "^0.141.1" }
pydantic-settings = "^2.15.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
