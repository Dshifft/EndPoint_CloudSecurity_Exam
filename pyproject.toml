[tool.poetry]
name = "endpoint-cloudsecurity-exam"
version = "0.1.0"
description = "Banking REST API for the EndPoint Cloud Security final project"
authors = ["Dshifft"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = { extras = ["standard"], version = "^0.141.1" }
pydantic-settings = "^2.15.0"
sqlalchemy = "^2.0.48"
psycopg2-binary = "^2.9.11"
passlib = { extras = ["all"], version = "^1.7.4" }
bcrypt = ">=3.2,<4.1"
python-jose = "^3.5.0"
cryptography = "^46.0.5"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
